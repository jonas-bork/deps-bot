name: Dependency automation
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  pull_request:
env:
  RENOVATE_VERSION: 44.115.10
jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Renovate
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/renovate
          key: renovate-cache-${{ github.run_id }}
          restore-keys: |
            renovate-cache-

      - name: Fix cache permissions
        run: |
          mkdir -p /tmp/renovate
          sudo chown -R 12021:0 /tmp/renovate

      - name: Generate app token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.DEPS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DEPS_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Run Renovate
        uses: renovatebot/github-action@f0f41e5f2e706165f6814b1d0f0d0e319de7d1d9 # v46.3.8
        env:
          RENOVATE_AUTODISCOVER: 'true'
          RENOVATE_BASE_DIR: /tmp/renovate
          RENOVATE_DRY_RUN: ${{ github.event_name == 'pull_request' && 'full' || 'false' }}
        with:
          renovate-version: ${{ env.RENOVATE_VERSION }}
          configurationFile: config.js
          token: ${{ steps.app-token.outputs.token }}
